{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "assetDiscovery.serviceAccountName" . }}
  labels:
    {{- include "assetDiscovery.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The automounted token is what the Kubernetes client reads the cluster with. The token
# presented to Polaris is a separate projected one with its own audience (deployment.yaml).
automountServiceAccountToken: true
{{- end }}
