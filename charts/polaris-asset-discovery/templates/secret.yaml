{{- if and (eq (include "assetDiscovery.authMode" .) "token") (not .Values.polaris.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "assetDiscovery.tokenSecretName" . }}
  labels:
    {{- include "assetDiscovery.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.polaris.existingSecretKey }}: {{ required "polaris.apiToken (or polaris.existingSecret) is required with token auth" .Values.polaris.apiToken | quote }}
{{- end }}
