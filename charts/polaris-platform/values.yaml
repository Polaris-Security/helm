# Polaris Security — platform chart values.
#
# Every environment-specific setting lives in this file; the templates carry no
# site-specific values. Before a first install, review at least:
#
#   ingress.hosts          the public hostname(s) you serve on
#   backend.existingSecret the Secret holding the backend environment
#   imagePullSecrets       credentials for the private polarissecurity/* images
#   postgres               bring-your-own database, or let CNPG provision one
#   externalSecrets        only if you use external-secrets.io
#   backend.config         FRONTEND_URL, DEFAULT_FROM_EMAIL and VAPID_SUBJECT default to
#                          vels.online addresses in the backend; set them for your install
#
# The backend reads many more settings than are listed below. The README's "Backend
# settings" section is the full reference: every variable, its default, and whether it
# belongs in the Secret or in backend.config.
#
# ─── Backend ──────────────────────────────────────────────────────────────────
backend:
  image:
    repository: docker.io/polarissecurity/backend
    tag: 0.99.83
    pullPolicy: Always
  # Name of an existing Secret holding the backend's environment variables. Every key in
  # it is injected with envFrom into the backend web/migrate, celery-worker and
  # celery-beat pods, and the celery-exporter reads REDIS_URL from it.
  #
  # The chart deliberately does not create this Secret — create it however you manage
  # secrets (external-secrets ExternalSecret, sealed-secrets, SOPS, or plain
  # `kubectl create secret generic backend-secret --from-env-file=.env`).
  # REDIS_URL must be one of its keys; the rest are the backend's own settings
  # (e.g. SECRET_KEY, POSTHOG_API_KEY) and are passed through verbatim.
  existingSecret: backend-secret

  # Hostnames Django accepts requests for. Empty ⇒ derived from ingress.hosts plus the
  # in-cluster Service DNS name, so you normally set the hostname only once, in
  # ingress.hosts. Set explicitly to take full control.
  allowedHosts: []
  # Origins trusted for CSRF. Empty ⇒ https://<host> for each ingress.hosts entry.
  csrfTrustedOrigins: []

  # Non-secret application settings, rendered verbatim into the backend-config ConfigMap
  # and mounted with envFrom by every backend pod. ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS
  # and POSTHOG_HOST are derived (see above) and must not be set here.
  #
  # NOTE: this ConfigMap is listed *after* the Secret in envFrom, so any key set here
  # overrides the same key in backend.existingSecret. Keep secrets out of it.
  config:
    # Django debug mode. The worker and beat tiers override this through extraEnv below.
    DEBUG: "False"

    # Set this to the full base URL of the install, used among other things for setting up peerings with other Polaris installs.
    DEPLOYMENT_BASE_URL: ""
    # This deployment's display name, shown to peers.
    DEPLOYMENT_NAME: "Polaris Security"

    # The backend defaults these to vels.online addresses. Set them on any other install:
    # FRONTEND_URL is the base of every link in outgoing email, DEFAULT_FROM_EMAIL is the
    # sender (and the reply-handle domain unless INBOUND_REPLY_DOMAIN is set), and
    # VAPID_SUBJECT is the contact address sent with web-push messages.
    #   FRONTEND_URL: https://polaris.example.com
    #   DEFAULT_FROM_EMAIL: noreply@example.com
    #   VAPID_SUBJECT: mailto:admin@example.com

    # Skip TLS certificate verification when sending mail. Only for an SMTP relay with a
    # self-signed certificate; set "False" when yours has a valid one. The SMTP host,
    # port and credentials (EMAIL_HOST, EMAIL_PORT, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD)
    # belong in backend.existingSecret.
    EMAIL_SSL_NO_VERIFY: "True"
    # Tags telemetry so production is distinguishable from dev/staging in PostHog.
    ENVIRONMENT: production
    # Console log level for every backend pod.
    LOG_LEVEL: INFO

    # Reverse proxy in front of the platform, used to build absolute URLs.
    BUNKERWEB_PUBLIC_FQDN: proxy.example.com
    # Mailbox the platform polls for inbound alert mail.
    INBOUND_IMAP_HOST: mail.example.com
    # Ansible/Semaphore project used for remediation playbooks.
    SEMAPHORE_PROJECT_ID: "1"
    # Authentik enrollment flow used when inviting users.
    AUTHENTIK_ENROLLMENT_FLOW_SLUG: default-enrollment-flow

    # gpt-oss reliably emits OpenAI-style tool_calls (gemma does not), which the
    # assistant agentic loop (ADR-0011) depends on. Ollama Cloud, tool + web-search
    # capable. Chat runs here; embeddings run on the in-cluster ollamaEmbed below.
    OLLAMA_MODEL: gpt-oss:120b-cloud

    # When a triaged incident is assigned to the on-call analyst: "always" assigns every
    # one; "llm_guided" only those triage recommends escalating or assigning.
    ONCALL_ROUTING: llm_guided
    # LLM provider class per feature, as a dotted path. Each defaults to the Ollama
    # provider; HARVEST_LLM_PROVIDER (Dossier Harvest) is also available and defaults to
    # the triage provider.
    EXCEPTION_LLM_PROVIDER: exceptions.llm.ollama.OllamaProvider
    TRIAGE_LLM_PROVIDER: incidents.llm.ollama.OllamaTriageProvider
    CORRELATION_LLM_PROVIDER: correlations.llm.ollama.OllamaDraftProvider
    CLOSURE_LLM_PROVIDER: incidents.llm.ollama.OllamaTriageProvider
    INCIDENT_ASSISTANT_LLM_PROVIDER: incidents.llm.ollama.OllamaTriageProvider
    # Triage Lesson distillation sweep (ADR-0030) — a low-volume batch reasoning job; can
    # be pointed at a stronger model than per-alert classify.
    DISTILL_LLM_PROVIDER: incidents.llm.ollama.OllamaTriageProvider

    # PostHog Logs bills per record; WARNING keeps the useful breadcrumbs without
    # shipping every task-progress INFO line. The console handler still emits at LOG_LEVEL.
    POSTHOG_LOGS_ENABLED: "True"
    POSTHOG_LOG_LEVEL: WARNING

    # Must be set for the knowledge exchange feature to do anything; the catalog reports itself unconfigured and stays empty otherwise
    KNOWLEDGE_EXCHANGE_REPO: "Polaris-Security/exchange"
    # Matched-document volume over the backtest at or above which an organisation is
    # pre-selected for Mute when an imported rule is enabled.
    KNOWLEDGE_EXCHANGE_PREMUTE_THRESHOLD: "100"

    # Setup the connection to Pulsegrid for monitoring services.
    PULSEGRID_BASE_URL: ""
    PULSEGRID_ORG_ID: ""

    # Incident Assistant: most model/tool iterations in one turn. Hitting it is a soft
    # checkpoint the analyst can Continue from.
    ASSISTANT_LOOP_MAX_ITERATIONS: "10"

    # Triage Agent Work-phase loop caps (ADR-0024/0025). Like a Hunt this runs in a Celery
    # worker, so nothing but these caps bounds it. An incident that needs more research than
    # the cap allows stops mid-work with stop_reason = max_iterations, so the ceiling is an
    # operational knob: raise it from the environment when real incidents keep hitting it,
    # without a release. The deadline is a second, independent bound — raising the iteration
    # ceiling alone does nothing once a run is long enough to hit the wall clock first.
    TRIAGE_AGENT_LOOP_MAX_ITERATIONS: 15
    TRIAGE_AGENT_LOOP_DEADLINE_S: 300

  # Additional ConfigMap entries, merged over backend.config. Use this from your own
  # values file to add or override single keys without restating the block above.
  extraConfig: {}

  # The web tier: gunicorn + the migrate init container.
  web:
    replicaCount: 1
    # Annotations on the Deployment itself. The default asks Stakater Reloader (if
    # installed) to restart the pods when backend-config changes; harmless without it.
    annotations:
      configmap.reloader.stakater.com/reload: "backend-config"
    podAnnotations: {}
    resources:
      requests:
        memory: 512Mi
    # Empty ⇒ no probe. The app serves /api/ but the health path is deployment-specific,
    # so the chart does not guess one.
    livenessProbe: {}
    readinessProbe: {}
    # Pod- and container-level security contexts. Empty ⇒ none set. The container
    # context also applies to the migrate init container and the metrics sidecar.
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # Extra environment variables for the web container only, as a list of EnvVar
    # objects. Takes precedence over backend.config and the Secret for this container.
    extraEnv: []

  worker:
    replicaCount: 1
    annotations:
      configmap.reloader.stakater.com/reload: "backend-config"
    podAnnotations: {}
    resources:
      requests:
        memory: 1024Mi
      limits:
        memory: 3096Mi
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # DEBUG=True on the workers is inherited from the original deployment. It makes
    # Django keep full tracebacks for task errors, at the cost of extra memory and more
    # verbose logs; set to "False" if you would rather match the web tier.
    extraEnv:
      - name: DEBUG
        value: "True"

  beat:
    # More than one beat replica double-schedules every periodic task. Keep at 1.
    replicaCount: 1
    annotations:
      configmap.reloader.stakater.com/reload: "backend-config"
    podAnnotations: {}
    resources:
      requests:
        memory: 256Mi
    podSecurityContext: {}
    securityContext: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    extraEnv:
      - name: DEBUG
        value: "True"

  # The `backend` Service the Ingress routes to. Its name is fixed (see README, Notes).
  service:
    type: ClusterIP
    port: 8000
    annotations: {}

# ─── Frontend ─────────────────────────────────────────────────────────────────
frontend:
  image:
    repository: docker.io/polarissecurity/frontend
    tag: 0.99.83
    pullPolicy: Always
  replicaCount: 1
  # Annotations on the Deployment, and on its pods.
  annotations: {}
  podAnnotations: {}
  resources: {}
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 20
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # The image is a static bundle served by nginx: the API base, Turnstile site key and
  # PostHog project are baked in at build time, so environment variables set here do
  # not change them.
  extraEnv: []
  service:
    type: ClusterIP
    port: 80
    annotations: {}

# ─── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  # e.g. nginx, traefik, bunkerweb — must match an IngressClass in your cluster.
  className: bunkerweb
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # SSE buffering: the streaming endpoint sets X-Accel-Buffering: no on its response,
    # which nginx honours per-response without requiring a blanket proxy_buffering off.
    # Non-streaming endpoints retain default buffering. See ADR-0014.
  # Public hostnames. Every host gets the same routing. Also the default source for
  # backend.allowedHosts and backend.csrfTrustedOrigins.
  hosts:
    - polaris.example.com
  tls:
    enabled: true
    # Empty ⇒ a `tls` block with hosts but no secretName, letting the ingress controller
    # supply the certificate. Set to a Secret name when cert-manager or your own cert
    # provides it.
    secretName: ""
  # Prefixes routed to the backend Service. Everything else falls through to the
  # frontend on "/".
  backendPaths:
    - /api/
    - /django-admin/
    - /login-redirect/
    - /static/
    - /auth/
  # Extra rules appended verbatim to spec.rules, for routing you cannot express above.
  extraRules: []

# ─── PostgreSQL (CloudNativePG) ───────────────────────────────────────────────
# The chart can provision a CNPG Cluster, or you can point it at a database you manage.
postgres:
  # false ⇒ no Cluster/backup objects are created. Set urlSecret to a Secret of your own
  # holding a Postgres connection URI.
  enabled: true
  # Requires the CloudNativePG operator in the cluster.
  cluster:
    # Also names the generated "<name>-app" Secret the backend reads DATABASE_URL from.
    name: cluster-polaris
    # Postgres instances: one primary, the rest streaming replicas.
    instances: 2
    # Database and owning role created at initdb (and expected inside a restored backup).
    database: polaris
    owner: polaris
    # Postgres operand image, e.g. ghcr.io/cloudnative-pg/postgresql:16.4. Empty ⇒ the
    # operator's default for its version. Changing the major version needs a CNPG
    # major-upgrade procedure, not just a new tag.
    imageName: ""
    # Requests/limits for each Postgres instance pod. Empty ⇒ none set.
    resources: {}
    storage:
      # Per-instance PVC size. CNPG can grow it in place if the storage class allows
      # expansion; it cannot shrink it.
      size: 10Gi
      # Empty ⇒ the cluster's default StorageClass.
      storageClass: local-path
    # postgresql.conf settings, applied for real by CNPG (values must be strings).
    # Empty by default: changing a postmaster-level setting such as max_connections
    # triggers a rolling restart of the cluster, so opt in deliberately.
    #   parameters:
    #     max_connections: "150"
    parameters: {}
    # Roles CNPG manages inside the cluster.
    managedRoles:
      - name: polaris
        superuser: true
        login: true
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # Where the backend reads its connection URI from. Empty name ⇒ "<cluster.name>-app",
  # the Secret CNPG generates for the owner role. Set both when postgres.enabled=false.
  urlSecret:
    name: ""
    key: fqdn-uri
  # S3-compatible WAL archiving + scheduled base backups via the barman-cloud plugin.
  # Requires the barman-cloud CNPG plugin installed in the cluster.
  backup:
    enabled: true
    # Name of the barman-cloud ObjectStore object the chart creates.
    objectStoreName: minio-store
    # Name this cluster archives its WAL and base backups under, inside destinationPath.
    # Empty ⇒ cluster.name, which is almost always what you want — including when
    # restoring, where keeping the name gives you one continuous backup catalog.
    # Set it to fork a restored cluster off into its own archive prefix instead; see
    # "Restoring from backup" in the README for when that is worth doing.
    serverName: ""
    # Bucket (and optional prefix) to archive into, and the S3-compatible endpoint.
    destinationPath: s3://REPLACE-ME-cnpg-backups/
    endpointURL: https://s3.eu-central-1.wasabisys.com
    # How long base backups and WAL are kept, e.g. "14d", "4w".
    retentionPolicy: "14d"
    # WAL compression (gzip, bzip2, snappy) and how many segments upload in parallel.
    walCompression: gzip
    walMaxParallel: 8
    # CNPG cron: seconds minutes hours dom month dow. Default = 00:09 every day.
    schedule: "0 9 0 * * *"
    # Secret holding the S3 credentials. Created for you when
    # externalSecrets.backupCredentials.enabled=true, otherwise bring your own.
    credentialsSecret:
      name: minio
      accessKeyIdKey: ACCESS_KEY_ID
      secretAccessKeyKey: ACCESS_SECRET_KEY

  # Bootstrap the cluster by restoring from the object store instead of initialising an
  # empty database. Deliberately separate from backup.enabled — archiving backups and
  # restoring from them are independent decisions, and a routine install must never try
  # to restore. Requires postgres.backup.enabled.
  #
  # Only read when the Cluster is *created*: CNPG ignores bootstrap on a cluster that
  # already exists, so flipping this on an existing release does nothing. To restore,
  # delete the old Cluster (or install into a clean namespace) and sync with
  # recovery.enabled=true.
  #
  # Restoring under the cluster's own name is fine and is the common case. Two things to
  # know when you do: a second restore from the same base backup archives the same
  # timeline over the first attempt's, which barman-cloud rejects rather than overwrites
  # — WAL archiving then stalls and segments pile up on the PVC — and the catalog ends up
  # holding several incarnations, so a later PITR may need backupID to say which one it
  # means. Set backup.serverName to give a restored cluster its own prefix and avoid both.
  recovery:
    enabled: false
    # Server name to restore *from*, as archived under backup.destinationPath.
    # Empty ⇒ cluster.name.
    sourceServerName: ""
    # Point-in-time recovery. Empty ⇒ replay every WAL segment available, i.e. restore to
    # the last archived transaction. Set one target to stop earlier; timestamps need an
    # explicit timezone offset:
    #   recoveryTarget:
    #     targetTime: "2026-08-19 14:30:00.000000+00"
    # CNPG also accepts targetLSN, targetXID, targetName (a restore point made with
    # pg_create_restore_point) and targetImmediate: true (stop the moment the restored
    # backup is consistent). backupID pins which base backup to start replaying from;
    # without it CNPG picks the latest one that precedes the target. Add
    # exclusive: false to replay *through* the target rather than stopping before it.
    recoveryTarget: {}

# ─── external-secrets.io (optional) ───────────────────────────────────────────
# Only relevant if you pull secrets from a vault via external-secrets.io. Everything
# here is off by default; without it, create the Secrets yourself.
externalSecrets:
  # Create a SecretStore in the release namespace.
  secretStore:
    enabled: false
    name: vault-backend
    # How often ExternalSecrets re-read the vault.
    refreshInterval: 120s
    # Only the Vault provider with Kubernetes auth is templated. For anything else,
    # leave this disabled and point backupCredentials.secretStoreRef at your own store.
    vault:
      server: http://vault.vault:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: k8s-role
  # Create the ExternalSecret that populates postgres.backup.credentialsSecret from the
  # vault path below. Ignored unless postgres.backup.enabled is also true.
  backupCredentials:
    enabled: false
    # Vault key holding ACCESS_KEY_ID / ACCESS_SECRET_KEY properties.
    remoteKey: kv/polaris
    # Name of the store to read from. Empty ⇒ externalSecrets.secretStore.name.
    secretStoreRef:
      name: ""
      # SecretStore or ClusterSecretStore.
      kind: SecretStore

# ─── Telemetry ────────────────────────────────────────────────────────────────
# Exception + log telemetry (ADR-0045). The project token itself is a POSTHOG_API_KEY key
# in the Secret named by backend.existingSecret — deliberately not here, so rotating it at
# the source is sufficient. Only the non-secret region endpoint is configurable here.
posthog:
  host: https://eu.i.posthog.com

# ─── Embeddings ───────────────────────────────────────────────────────────────
# Self-hosted Ollama used ONLY for embeddings (issue #657 semantic precedent-recall
# measurement) — Ollama Cloud serves no embedding models. A standalone Deployment (not a
# backend sidecar) keeps the backend schedulable anywhere; chat stays on Ollama Cloud
# (backend.config.OLLAMA_MODEL). The measurement job targets this service via a per-run
# OLLAMA_BASE_URL=http://ollama-embed:11434 override.
ollamaEmbed:
  enabled: true
  # Convenience pin to a single GPU node, expanded to a kubernetes.io/hostname
  # nodeSelector. Leave empty and use nodeSelector/tolerations for anything richer.
  nodeName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # k3s auto-creates the "nvidia" RuntimeClass when the NVIDIA container runtime is
  # present; set to "nvidia" if GPU pods need it explicitly on your cluster, else leave
  # empty.
  runtimeClassName: ""
  # 0 ⇒ no nvidia.com/gpu limit, i.e. CPU-only embedding (slow but portable).
  gpuCount: 1
  memoryRequest: 1Gi
  # Full requests/limits block. Set it to take control of resources: it replaces
  # memoryRequest and gpuCount, so include nvidia.com/gpu yourself if you need a GPU.
  resources: {}
  podAnnotations: {}
  # Embedding model pulled on start. The backend's own OLLAMA_EMBED_MODEL (default
  # nomic-embed-text) must name the same model.
  model: nomic-embed-text
  image:
    # Public image; mirror into a registry the cluster can reach if Docker Hub is
    # unreachable.
    repository: docker.io/ollama/ollama
    tag: latest # pin to a released tag in production
    # Empty ⇒ the Kubernetes default, which is Always for the `latest` tag and
    # IfNotPresent otherwise. Set explicitly if you pin a tag and want re-pulls.
    pullPolicy: ""
  service:
    port: 11434
  # Model cache. false ⇒ an emptyDir, so every restart downloads the model again.
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "" # empty ⇒ cluster default (k3s local-path, node-local)

# ─── Monitoring ───────────────────────────────────────────────────────────────
# Operational observability (ADR-0019). Plugs into the cluster's existing Prometheus
# Operator (kube-prometheus-stack) — we ship only the CRDs/dashboards/alerts, never the
# stack itself. Gated so the chart still installs cleanly with monitoring disabled.
monitoring:
  enabled: true
  # Dedicated metrics-aggregation port for the backend sidecar. Not routed by the Ingress.
  metricsPort: 9808
  # How often the operator scrapes our targets.
  scrapeInterval: 30s
  # Labels the operator's Prometheus uses to discover our ServiceMonitor/PodMonitor and
  # PrometheusRule. Matches the existing CNPG PodMonitor (prometheus: "true").
  selectorLabels:
    prometheus: "true"
  # Label the Grafana sidecar watches to auto-load dashboard ConfigMaps.
  grafanaDashboardLabel:
    grafana_dashboard: "1"
  # Ship the starter Grafana dashboard ConfigMap.
  dashboard:
    enabled: true
  # Celery metrics from the broker's task events. Reads REDIS_URL from
  # backend.existingSecret.
  celeryExporter:
    enabled: true
    # Full image reference, repository and tag together.
    image: ghcr.io/danihodovic/celery-exporter:0.12.2
    # Empty ⇒ the Kubernetes default for the tag.
    pullPolicy: ""
    port: 9808
    resources:
      requests:
        memory: 128Mi
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # PrometheusRule alerts. Thresholds are the ones the platform was tuned with.
  alerts:
    enabled: true
    # BackendMetricsDown (critical): the metrics sidecar has been unscrapeable this long.
    backendMetricsDownFor: 5m
    # BackendHigh5xxRate (warning): share of HTTP responses that are 5xx (0.05 = 5%),
    # sustained this long.
    high5xxRatio: 0.05
    high5xxFor: 10m
    # CeleryTaskBacklog (warning): total queued tasks above this, sustained this long.
    celeryBacklogThreshold: 100
    celeryBacklogFor: 15m
    # CeleryHighFailureRate (warning): share of received tasks that failed (0.1 = 10%).
    celeryFailureRatio: 0.1
    celeryFailureFor: 10m
    # PodCrashLooping (critical): any container in the namespace in CrashLoopBackOff.
    crashLoopFor: 10m

# ─── Asset Discovery (polaris-asset-discovery subchart) ───────────────────────
# Reports the workloads running in this cluster — what runs, which version, and whether a
# public load balancer or ingress fronts it — to this platform as Workload Assets in the
# Infrastructure organisation, under the Cluster Asset `clusterName`.
#
# No token to create: the discovery pod presents its projected service account token and
# the backend verifies it with a TokenReview. For that the chart gives the backend web pod
# its own ServiceAccount bound to `system:auth-delegator` (create TokenReviews, nothing
# else) and tells it which service account to accept.
#
# Every option of the standalone chart works here under `assetDiscovery.` — see
# charts/polaris-asset-discovery/values.yaml.
assetDiscovery:
  enabled: true
  # A fixed name, because the backend's allowlist has to name the service account.
  fullnameOverride: polaris-asset-discovery
  image:
    repository: docker.io/polarissecurity/asset-discovery
    tag: 0.99.83
  polaris:
    # The backend Service in this release's namespace, which ALLOWED_HOSTS already admits.
    url: "http://backend.{{ .Release.Namespace }}.svc.cluster.local:8000"
    auth: kubernetes
    verifyTls: true
  # Name of the Cluster Asset the workloads hang under.
  clusterName: polaris
  # How often a full snapshot is sent, and how long a workload outlives its last report.
  refreshInterval: 5m
  assetTtl: 24h
  # Also report changes as they happen, between full snapshots.
  watch:
    enabled: true
  # The backend's ASSET_DISCOVERY_KUBERNETES_AUDIENCE is derived from
  # assetDiscovery.polaris.tokenAudience, so change the audience only there.
  # The polarissecurity images are private: repeat the top-level imagePullSecrets here,
  # since a subchart does not see its parent's values.
  imagePullSecrets: []

# ─── Valkey (Celery broker + cache, bitnami subchart) ─────────────────────────
valkey:
  # false ⇒ subchart is skipped entirely; point REDIS_URL in backend.existingSecret at
  # your own Redis/Valkey.
  enabled: true
  # Any value of the bitnami/valkey 6.2.4 chart can be set under this key; only the
  # ones the platform depends on are listed. See that chart's values.yaml.
  architecture: standalone
  auth:
    enabled: true
    # Secret holding the Valkey password. The chart does not create it; the password
    # must match the one inside REDIS_URL in backend.existingSecret.
    existingSecret: "valkey-secret"
    existingSecretPasswordKey: "valkey-password"
  primary:
    # Off: Valkey is a broker and cache here, and a restart only loses queued tasks
    # and cached values. Turn on if queued tasks must survive a restart.
    persistence:
      enabled: false
  # Reuse the off-the-shelf Valkey metrics exporter and let the operator scrape it
  # (ADR-0019). The ServiceMonitor carries the operator's discovery label.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        prometheus: "true"
