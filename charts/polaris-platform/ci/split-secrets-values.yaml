# CI case: each backend workload mounts its own Secret (backend.secrets.mode=split,
# Polaris ADR-0159), rendered as ExternalSecrets from Vault, with Response Plugin
# credentials going to the default worker (no Response Worker yet).
externalSecrets:
  secretStore:
    enabled: true
    vault:
      server: https://vault.acme.test:8200

backend:
  secrets:
    mode: split
    web:
      keys: [SECRET_KEY, REDIS_URL, LLM_CREDENTIAL_ENCRYPTION_KEY, AUTHENTIK_ENROLLMENT_API_TOKEN, OLLAMA_API_KEY]
    worker:
      keys: [SECRET_KEY, REDIS_URL, LLM_CREDENTIAL_ENCRYPTION_KEY, AUTHENTIK_ENROLLMENT_API_TOKEN, AUTHENTIK_READER_API_TOKEN, OLLAMA_API_KEY]
    responseKeys: [AUTHENTIK_RESPONSE_API_TOKEN, ENTRA_TENANT_ID, ENTRA_CLIENT_ID, ENTRA_CLIENT_SECRET]
    externalSecret:
      enabled: true
      remoteKey: kv/polaris/backend
