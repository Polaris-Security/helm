# CI case: everything enabled and overridden away from the defaults. Exercises the
# multi-host Ingress loop, the external-secrets objects, per-component scheduling and
# probes, security contexts, Service annotations, a renamed and pinned Postgres cluster
# (so DATABASE_URL has to follow it), CPU-only embedding with explicit resources, and a
# custom Asset Discovery token audience the backend has to follow.
ingress:
  className: nginx
  hosts:
    - polaris.acme.test
    - alerts.acme.test
  tls:
    secretName: polaris-tls

# Exercises the PWA's Deployment, Service and its own Ingress rule.
mobile:
  enabled: true
  host: mobile.acme.test
  annotations:
    team: mobile
  service:
    annotations:
      service.beta.kubernetes.io/internal: "true"

frontend:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
  securityContext:
    allowPrivilegeEscalation: false

externalSecrets:
  secretStore:
    enabled: true
    vault:
      server: https://vault.acme.test:8200
      auth:
        kubernetes:
          role: polaris-role
  backupCredentials:
    enabled: true
    remoteKey: kv/acme

backend:
  extraConfig:
    LOG_LEVEL: DEBUG
    CUSTOM_FLAG: "yes"
  service:
    annotations:
      prometheus.io/scrape: "false"
  worker:
    podSecurityContext:
      fsGroup: 1000
    securityContext:
      allowPrivilegeEscalation: false
  web:
    replicaCount: 3
    securityContext:
      allowPrivilegeEscalation: false
    readinessProbe:
      httpGet:
        path: /api/health/
        port: http
    nodeSelector:
      workload: web
    tolerations:
      - key: dedicated
        operator: Equal
        value: web
        effect: NoSchedule

postgres:
  cluster:
    name: pg-acme
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:16.4
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
    parameters:
      max_connections: "150"
  backup:
    destinationPath: s3://acme-backups/
    retentionPolicy: 30d

ollamaEmbed:
  nodeName: gpu-01
  gpuCount: 0
  resources:
    requests:
      cpu: "1"
      memory: 2Gi

monitoring:
  celeryExporter:
    pullPolicy: IfNotPresent
    nodeSelector:
      workload: monitoring

imagePullSecrets:
  - name: registry-credentials

assetDiscovery:
  polaris:
    tokenAudience: acme-discovery
