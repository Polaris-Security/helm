# CI case: the Credential Broker fetches integration credentials from Vault on use
# (Polaris PRD #1214, ADR-0160), with the Response Worker and per-workload Secrets. Each
# of web, the default worker and the Response Worker gets a projected Vault-audience
# token, its own role and its own Credential Manifest; no ExternalSecret copies an
# integration credential.
externalSecrets:
  secretStore:
    enabled: true
    vault:
      server: https://vault.acme.test:8200

assetDiscovery:
  enabled: false

backend:
  credentials:
    backend: vault
    vault:
      addr: https://vault.acme.test:8200
    web:
      manifest:
        authentik.enrollment: {path: polaris/web/authentik-enrollment}
        bunkerweb: {path: polaris/web/bunkerweb}
    worker:
      manifest:
        authentik.enrollment: {path: polaris/worker/authentik-enrollment}
        authentik.reader: {path: polaris/worker/authentik-reader}
    responseWorker:
      manifest:
        authentik.response: {path: polaris/response-worker/authentik-response, ttl: 30}
        entra:
          path: polaris/response-worker/entra
          ttl: 30
          fields: {tenant_id: 00000000-0000-0000-0000-000000000001, client_id: 00000000-0000-0000-0000-000000000002}
  secrets:
    mode: split
    web:
      keys: [SECRET_KEY, REDIS_URL, AUTHENTIK_ENROLLMENT_API_TOKEN]
    worker:
      keys: [SECRET_KEY, REDIS_URL, AUTHENTIK_ENROLLMENT_API_TOKEN, AUTHENTIK_READER_API_TOKEN]
    responseKeys: []
    externalSecret:
      enabled: true
      remoteKey: kv/polaris/backend
  responseWorker:
    enabled: true
    externalSecret:
      enabled: true
