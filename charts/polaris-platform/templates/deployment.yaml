apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  {{- with .Values.backend.web.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.backend.web.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      {{- with .Values.backend.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "polaris.backendServiceAccount" .) }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with (include "polaris.podSpec" (dict "root" . "component" .Values.backend.web) | trim) }}
      {{- nindent 6 . }}
      {{- end }}
      initContainers:
        {{- with (include "polaris.geoip.initContainer" .) }}
        # Downloads GeoLite2-ASN before Django starts (geoip.*).
        {{- nindent 8 . }}
        {{- end }}
        - name: migrate
          image: {{ include "polaris.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          {{- with .Values.backend.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "polaris.backendSecretName" . }}
            - configMapRef:
                name: backend-config
          env:
            {{- include "polaris.backendEnv" . | nindent 12 }}
      containers:
        - name: backend
          image: {{ include "polaris.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ include "polaris.backendSecretName" . }}
            - configMapRef:
                name: backend-config
          env:
            {{- include "polaris.backendEnv" . | nindent 12 }}
            # Tags PostHog events with the deployed release, and separates the web pod
            # from the worker/beat pods that share this ConfigMap (ADR-0045).
            - name: RELEASE
              value: {{ .Values.backend.image.tag | quote }}
            - name: SERVICE_NAME
              value: polaris-backend
            {{- if .Values.monitoring.enabled }}
            # gunicorn runs multiple workers; prometheus_client multiprocess mode
            # writes per-process samples here for the metrics sidecar to aggregate
            # (ADR-0019). Deliberately not exposed on the Ingress-routed port 8000.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
            {{- end }}
            {{- with (include "polaris.geoip.appEnv" .) }}
            {{- nindent 12 . }}
            {{- end }}
            {{- with .Values.backend.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.backend.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.web.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.web.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.monitoring.enabled .Values.geoip.enabled }}
          volumeMounts:
            {{- if .Values.monitoring.enabled }}
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus-multiproc
            {{- end }}
            {{- with (include "polaris.geoip.appVolumeMount" .) }}
            {{- nindent 12 . }}
            {{- end }}
          {{- end }}
        {{- with (include "polaris.geoip.sidecar" .) }}
        # Keeps GeoLite2-ASN fresh every geoip.frequencyHours.
        {{- nindent 8 . }}
        {{- end }}
        {{- if .Values.monitoring.enabled }}
        # Aggregating metrics endpoint on a dedicated port the public Ingress never
        # routes to; only the in-cluster Prometheus scraper reaches it.
        - name: metrics-exporter
          image: {{ include "polaris.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "metrics_exporter.py"]
          {{- with .Values.backend.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.monitoring.metricsPort }}
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
            - name: METRICS_PORT
              value: {{ .Values.monitoring.metricsPort | quote }}
          volumeMounts:
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus-multiproc
        {{- end }}
      {{- if or .Values.monitoring.enabled .Values.geoip.enabled }}
      volumes:
        {{- if .Values.monitoring.enabled }}
        - name: prometheus-multiproc
          emptyDir: {}
        {{- end }}
        {{- with (include "polaris.geoip.volume" .) }}
        {{- nindent 8 . }}
        {{- end }}
      {{- end }}
