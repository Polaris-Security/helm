{{- if .Values.assetDiscovery.enabled }}
# The backend web pod verifies Asset Discovery's projected token with a TokenReview
# (ADR-0127 in polaris-security). `system:auth-delegator` grants creating TokenReviews and
# SubjectAccessReviews and nothing else — no read of any object in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "polaris.backendServiceAccount" . }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-backend-token-review" .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "polaris.backendServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
