apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  {{- with .Values.backend.beat.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.backend.beat.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
      {{- with .Values.backend.beat.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "polaris.podSpec" (dict "root" . "component" .Values.backend.beat) | trim) }}
      {{- nindent 6 . }}
      {{- end }}
      containers:
        - name: celery-beat
          image: {{ include "polaris.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["celery", "-A", "config", "beat", "-l", "INFO"]
          {{- with .Values.backend.beat.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "polaris.backendSecretName" . }}
            - configMapRef:
                name: backend-config
          env:
            {{- include "polaris.backendEnv" . | nindent 12 }}
            # Distinguishes beat exceptions from web/worker exceptions in PostHog
            # (ADR-0045); all three pods share the backend-config ConfigMap.
            - name: RELEASE
              value: {{ .Values.backend.image.tag | quote }}
            - name: SERVICE_NAME
              value: polaris-beat
            {{- with .Values.backend.beat.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
