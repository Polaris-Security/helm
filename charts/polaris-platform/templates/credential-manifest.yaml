{{- if include "polaris.credentialsVault" . }}
{{- $c := .Values.backend.credentials }}
{{- $workloads := list "web" "worker" }}
{{- if .Values.backend.responseWorker.enabled }}
{{- $workloads = append $workloads "responseWorker" }}
{{- end }}
{{- range $workload := $workloads }}
---
# The {{ $workload }} pod's Credential Manifest (Polaris ADR-0160): which integration
# credentials it has and where each lives in Vault. Not secret: the values are fetched
# from Vault when used, as the pod's own ServiceAccount.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polaris.credentialManifestName" (dict "root" $ "workload" $workload) }}
  labels:
    polaris.io/workload: {{ $workload | kebabcase }}
data:
  manifest.json: {{ (index $c $workload).manifest | default dict | toJson | quote }}
{{- end }}
{{- if not .Values.assetDiscovery.enabled }}
---
# web's own identity for Vault's Kubernetes auth (role backend.credentials.web.role). The
# pod mounts no API token: only its projected Vault-audience token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.web.serviceAccount }}
automountServiceAccountToken: false
{{- end }}
---
# The default worker's own identity for Vault (role backend.credentials.worker.role).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.worker.serviceAccount }}
automountServiceAccountToken: false
{{- end }}
