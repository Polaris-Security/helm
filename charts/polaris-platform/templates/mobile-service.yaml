{{- if .Values.mobile.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mobile
  labels:
    app: mobile
  {{- with .Values.mobile.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mobile.service.type }}
  selector:
    app: mobile
  ports:
    - name: http
      port: {{ .Values.mobile.service.port }}
      targetPort: http
{{- end }}
