{{- if and .Values.monitoring.enabled .Values.monitoring.celeryExporter.enabled }}
# Off-the-shelf celery-exporter (ADR-0019): consumes task events from the Valkey
# broker and exposes throughput/failure/retry/queue-depth metrics. No worker-side
# instrumentation — the workers just emit task events (CELERY_*_SEND_*_EVENT settings).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-exporter
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: celery-exporter
  template:
    metadata:
      labels:
        app: celery-exporter
    spec:
      {{- with (include "polaris.podSpec" (dict "root" . "component" dict) | trim) }}
      {{- nindent 6 . }}
      {{- end }}
      containers:
        - name: celery-exporter
          image: {{ .Values.monitoring.celeryExporter.image }}
          ports:
            - name: metrics
              containerPort: {{ .Values.monitoring.celeryExporter.port }}
          env:
            # The exporter reads the same broker the app uses; CE_* is its config prefix.
            - name: CE_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "polaris.backendSecretName" . }}
                  key: REDIS_URL
            - name: CE_PORT
              value: {{ .Values.monitoring.celeryExporter.port | quote }}
          {{- with .Values.monitoring.celeryExporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: celery-exporter
  labels:
    app: celery-exporter
    {{- toYaml .Values.monitoring.selectorLabels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: celery-exporter
  ports:
    - name: metrics
      port: {{ .Values.monitoring.celeryExporter.port }}
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: celery-exporter
  labels:
    {{- toYaml .Values.monitoring.selectorLabels | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: celery-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
{{- end }}
