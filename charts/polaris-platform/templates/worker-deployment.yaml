apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  {{- with .Values.backend.worker.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.backend.worker.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
      {{- with .Values.backend.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if include "polaris.credentialsVault" . }}
      # Its own identity for Vault's Kubernetes auth; only the projected Vault token is
      # mounted (Polaris ADR-0160).
      serviceAccountName: {{ .Values.backend.credentials.worker.serviceAccount }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with (include "polaris.podSpec" (dict "root" . "component" .Values.backend.worker) | trim) }}
      {{- nindent 6 . }}
      {{- end }}
      {{- with (include "polaris.geoip.initContainer" .) }}
      initContainers:
        # Downloads GeoLite2-ASN before the worker starts (geoip.*).
        {{- nindent 8 . }}
      {{- end }}
      containers:
        - name: celery-worker
          image: {{ include "polaris.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["celery", "-A", "config", "worker", "-l", "INFO"]
          {{- with .Values.backend.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.worker.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "polaris.workloadSecretName" (dict "root" . "workload" "worker") }}
            - configMapRef:
                name: backend-config
          env:
            {{- include "polaris.backendEnv" . | nindent 12 }}
            # Distinguishes worker exceptions from web exceptions in PostHog (ADR-0045);
            # both pods share the backend-config ConfigMap.
            - name: RELEASE
              value: {{ .Values.backend.image.tag | quote }}
            - name: SERVICE_NAME
              value: polaris-worker
            {{- with (include "polaris.geoip.appEnv" .) }}
            {{- nindent 12 . }}
            {{- end }}
            {{- with (include "polaris.credentialEnv" (dict "root" . "workload" "worker")) }}
            {{- nindent 12 . }}
            {{- end }}
            {{- with .Values.backend.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $mounts := printf "%s\n%s" (include "polaris.geoip.appVolumeMount" .) (include "polaris.credentialVolumeMounts" (dict "root" . "workload" "worker")) | trim }}
          {{- with $mounts }}
          volumeMounts:
            {{- nindent 12 . }}
          {{- end }}
        {{- with (include "polaris.geoip.sidecar" .) }}
        # Keeps GeoLite2-ASN fresh every geoip.frequencyHours.
        {{- nindent 8 . }}
        {{- end }}
      {{- $volumes := printf "%s\n%s" (include "polaris.geoip.volume" .) (include "polaris.credentialVolumes" (dict "root" . "workload" "worker")) | trim }}
      {{- with $volumes }}
      volumes:
        {{- nindent 8 . }}
      {{- end }}
