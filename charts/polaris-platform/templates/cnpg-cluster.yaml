{{- if .Values.postgres.enabled }}
# PostgreSQL provisioned by the CloudNativePG operator, which must already be installed
# in the cluster. Set postgres.enabled=false to bring your own database instead — then
# postgres.urlSecret must name a Secret holding a connection URI.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.cluster.name }}
spec:
  instances: {{ .Values.postgres.cluster.instances }}
  storage:
    size: {{ .Values.postgres.cluster.storage.size }}
    {{- with .Values.postgres.cluster.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  {{- with .Values.postgres.cluster.managedRoles }}
  managed:
    roles:
      {{- toYaml . | nindent 6 }}
  {{- end }}

  bootstrap:
    initdb:
      database: {{ .Values.postgres.cluster.database }}
      owner: {{ .Values.postgres.cluster.owner }}

  {{- with .Values.postgres.cluster.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}

  {{- with .Values.postgres.cluster.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.postgres.cluster.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.postgres.cluster.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if .Values.postgres.backup.enabled }}
  # Recovery source: lets a fresh Cluster be bootstrapped from the object store by
  # switching bootstrap above to `recovery`.
  externalClusters:
    - name: {{ .Values.postgres.cluster.name }}
      barmanObjectStore:
        destinationPath: {{ .Values.postgres.backup.destinationPath | quote }}
        endpointURL: {{ .Values.postgres.backup.endpointURL | quote }}
        s3Credentials:
          accessKeyId:
            name: {{ .Values.postgres.backup.credentialsSecret.name }}
            key: {{ .Values.postgres.backup.credentialsSecret.accessKeyIdKey }}
          secretAccessKey:
            name: {{ .Values.postgres.backup.credentialsSecret.name }}
            key: {{ .Values.postgres.backup.credentialsSecret.secretAccessKeyKey }}
        wal:
          maxParallel: {{ .Values.postgres.backup.walMaxParallel }}

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.postgres.backup.objectStoreName }}
  {{- end }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.postgres.cluster.name }}
  labels:
    {{- toYaml .Values.monitoring.selectorLabels | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.postgres.cluster.name }}
  podMetricsEndpoints:
    - port: metrics
{{- end }}
{{- if .Values.postgres.backup.enabled }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Values.postgres.backup.objectStoreName }}
spec:
  retentionPolicy: {{ .Values.postgres.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ .Values.postgres.backup.destinationPath | quote }}
    endpointURL: {{ .Values.postgres.backup.endpointURL | quote }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.postgres.backup.credentialsSecret.name }}
        key: {{ .Values.postgres.backup.credentialsSecret.accessKeyIdKey }}
      secretAccessKey:
        name: {{ .Values.postgres.backup.credentialsSecret.name }}
        key: {{ .Values.postgres.backup.credentialsSecret.secretAccessKeyKey }}
    wal:
      compression: {{ .Values.postgres.backup.walCompression }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: backup-polaris-db
spec:
  cluster:
    name: {{ .Values.postgres.cluster.name }}
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- end }}
