{{- if and (include "polaris.secretsSplit" .) .Values.backend.secrets.externalSecret.enabled }}
{{- $es := .Values.backend.secrets.externalSecret }}
{{- range $workload := list "web" "worker" "beat" "migrate" }}
---
# The {{ $workload }} pod's own Secret (backend.secrets, Polaris ADR-0159): exactly the keys
# listed for it, read from Vault. Nothing else of the backend environment reaches it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "polaris.workloadSecretName" (dict "root" $ "workload" $workload) }}
  labels:
    polaris.io/workload: {{ $workload }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.secretStore.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name | default $.Values.externalSecrets.secretStore.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "polaris.workloadSecretName" (dict "root" $ "workload" $workload) }}
    creationPolicy: Owner
  data:
    {{- range include "polaris.workloadKeys" (dict "root" $ "workload" $workload) | fromYamlArray }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- else if include "polaris.secretsSplit" . }}
{{- /* Bring-your-own Secrets: still check each workload's key list, so a mistake fails the render. */}}
{{- range $workload := list "web" "worker" "beat" "migrate" }}
{{- $_ := include "polaris.workloadKeys" (dict "root" $ "workload" $workload) }}
{{- end }}
{{- end }}
