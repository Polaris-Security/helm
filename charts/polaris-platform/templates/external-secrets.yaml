{{- if .Values.externalSecrets.secretStore.enabled }}
# Optional external-secrets.io wiring. Off by default: the chart never requires ESO, and
# without it you simply create the Secrets yourself (see README). Requires the
# external-secrets operator and, for the Kubernetes auth method below, a Vault role bound
# to this namespace's ServiceAccount.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStore.name }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.secretStore.vault.server | quote }}
      path: {{ .Values.externalSecrets.secretStore.vault.path | quote }}
      version: {{ .Values.externalSecrets.secretStore.vault.version | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.externalSecrets.secretStore.vault.auth.kubernetes.mountPath | quote }}
          role: {{ .Values.externalSecrets.secretStore.vault.auth.kubernetes.role | quote }}
{{- end }}
{{- if and .Values.externalSecrets.backupCredentials.enabled .Values.postgres.enabled .Values.postgres.backup.enabled }}
---
# Populates the S3 credentials Secret that CNPG's barman-cloud plugin reads.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.backup.credentialsSecret.name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.secretStore.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.backupCredentials.secretStoreRef.name | default .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.backupCredentials.secretStoreRef.kind }}
  target:
    name: {{ .Values.postgres.backup.credentialsSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.postgres.backup.credentialsSecret.accessKeyIdKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.backupCredentials.remoteKey | quote }}
        property: {{ .Values.postgres.backup.credentialsSecret.accessKeyIdKey }}
    - secretKey: {{ .Values.postgres.backup.credentialsSecret.secretAccessKeyKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.backupCredentials.remoteKey | quote }}
        property: {{ .Values.postgres.backup.credentialsSecret.secretAccessKeyKey }}
{{- end }}
