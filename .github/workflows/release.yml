name: Release chart

# Every push to main publishes the chart to two Helm repositories:
#
#   - GitHub Pages (the gh-pages branch):  https://polaris-security.github.io/helm
#   - the in-cluster ChartMuseum mirror:   https://charts.vels.online
#
#   helm repo add polaris https://polaris-security.github.io/helm
#   helm install polaris polaris/polaris
#
# GitHub has been unreliable, so the two are independent: every GitHub-facing step is
# allowed to fail without stopping the ChartMuseum push. A GitHub failure still fails
# the run at the very end, so it does not go unnoticed.
#
# ChartMuseum is currently DISABLED (CHARTMUSEUM_ENABLED below) because its push was
# failing and blocking GitHub releases. While disabled, nothing talks to ChartMuseum and
# the GitHub steps fail the job directly again. Set it back to "true" to re-enable.
#
# ChartMuseum credentials come from the CHARTMUSEUM_USERNAME / CHARTMUSEUM_PASSWORD
# repository secrets; leave them unset if the instance does not require auth.
#
# The chart version is bumped automatically when the version currently in Chart.yaml
# has already been released. Bump `version:` in Chart.yaml by hand for a minor or major
# release and this workflow will respect it.
on:
  push:
    branches:
      - main
  # Manual re-run, for when a release needs redoing without a source change — or when a
  # push was skipped because its commit message contained a skip-CI token.
  workflow_dispatch:

# Never release two versions at once: the job pushes a version bump back to main and
# rewrites the index on gh-pages, both of which race badly.
concurrency:
  group: release-chart
  cancel-in-progress: false

env:
  CHARTMUSEUM_ENABLED: "false"
  CHARTMUSEUM_URL: https://charts.vels.online

jobs:
  test:
    uses: ./.github/workflows/lint-test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the version bump, create the GitHub Release, and write gh-pages.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # chart-releaser diffs against the previous tag to decide what changed.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine chart version
        id: version
        env:
          CHARTMUSEUM_USERNAME: ${{ secrets.CHARTMUSEUM_USERNAME }}
          CHARTMUSEUM_PASSWORD: ${{ secrets.CHARTMUSEUM_PASSWORD }}
        run: |
          set -euo pipefail
          chart=charts/polaris-platform/Chart.yaml
          # Only the top-level keys: `appVersion` does not match /^version:/ and the
          # dependency's version line is indented.
          name=$(awk '/^name:/    {print $2; exit}' "$chart")
          current=$(awk '/^version:/ {print $2; exit}' "$chart")

          git fetch --tags --quiet
          auth=()
          if [ -n "${CHARTMUSEUM_USERNAME:-}" ]; then
            auth=(--user "$CHARTMUSEUM_USERNAME:$CHARTMUSEUM_PASSWORD")
          fi
          # A version counts as released if chart-releaser tagged it (<chart>-<version>)
          # or ChartMuseum already has it — the latter covers a run where the GitHub
          # release failed but the mirror push succeeded, so we never publish a
          # different build under a version ChartMuseum already serves. An unreachable
          # ChartMuseum is treated as "not released" rather than blocking.
          released() {
            git rev-parse -q --verify "refs/tags/${name}-$1" >/dev/null && return 0
            [ "$CHARTMUSEUM_ENABLED" = "true" ] || return 1
            curl -fsS -o /dev/null --max-time 15 "${auth[@]}" \
              "$CHARTMUSEUM_URL/api/charts/${name}/$1" 2>/dev/null
          }
          # Walk the patch number forward until we find one that has not been released,
          # so a hand-written minor/major bump in Chart.yaml is used as-is.
          next="$current"
          while released "$next"; do
            next=$(echo "$next" | awk -F. -v OFS=. '{$3=$3+1; print}')
          done

          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next"       >> "$GITHUB_OUTPUT"
          echo "Chart $name: $current -> $next"

      - name: Commit version bump
        if: steps.version.outputs.next != steps.version.outputs.current
        run: |
          set -euo pipefail
          chart=charts/polaris-platform/Chart.yaml
          # Rewrite the first ^version: line only, leaving appVersion and the indented
          # dependency version untouched.
          awk -v v="${{ steps.version.outputs.next }}" \
            '!done && /^version:/ { print "version: " v; done=1; next } { print }' \
            "$chart" > "$chart.tmp"
          mv "$chart.tmp" "$chart"
          grep -q "^version: ${{ steps.version.outputs.next }}$" "$chart"
          git add "$chart"
          git commit -m "chore: release chart ${{ steps.version.outputs.next }} [skip ci]"

      - name: Push version bump
        id: push_bump
        if: steps.version.outputs.next != steps.version.outputs.current
        continue-on-error: ${{ env.CHARTMUSEUM_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          # Another push may have landed while the tests ran.
          git pull --rebase origin main
          git push origin HEAD:main

      # Before fetching dependencies: `switch --orphan` empties the working tree, so
      # keep it away from the fetched subchart tarball.
      - name: Ensure the gh-pages branch exists
        id: gh_pages
        continue-on-error: ${{ env.CHARTMUSEUM_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages already exists"
            exit 0
          fi
          echo "Bootstrapping an empty gh-pages branch for the chart index"
          # Restore by SHA rather than `git switch -`: the checkout action can leave
          # HEAD detached, and then @{-1} does not resolve.
          restore=$(git rev-parse HEAD)
          git switch --orphan gh-pages
          cat > index.md <<'EOF'
          # Polaris Security Helm repository

          helm repo add polaris https://polaris-security.github.io/helm
          helm repo update
          helm install polaris polaris/polaris -f my-values.yaml
          EOF
          git add index.md
          git commit -m "chore: initialise Helm chart repository"
          git push origin gh-pages
          git checkout -f "$restore"

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Fetch chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          # The packaged chart must contain the subchart tarball, or installs from the
          # repository fail on a missing dependency.
          helm dependency build charts/polaris-platform

      # Pushed before the GitHub release so a GitHub outage cannot get in its way.
      - name: Push to ChartMuseum
        id: chartmuseum
        if: env.CHARTMUSEUM_ENABLED == 'true'
        env:
          CHARTMUSEUM_USERNAME: ${{ secrets.CHARTMUSEUM_USERNAME }}
          CHARTMUSEUM_PASSWORD: ${{ secrets.CHARTMUSEUM_PASSWORD }}
        run: |
          set -euo pipefail
          # Package outside the checkout so chart-releaser never sees this tarball.
          out="$RUNNER_TEMP/chartmuseum"
          mkdir -p "$out"
          helm package charts/polaris-platform --destination "$out"
          pkg="$out/${{ steps.version.outputs.name }}-${{ steps.version.outputs.next }}.tgz"
          test -f "$pkg"

          auth=()
          if [ -n "${CHARTMUSEUM_USERNAME:-}" ]; then
            auth=(--user "$CHARTMUSEUM_USERNAME:$CHARTMUSEUM_PASSWORD")
          fi
          status=$(curl -sS --retry 3 --retry-all-errors --max-time 120 \
            -o "$out/response" -w '%{http_code}' "${auth[@]}" \
            --data-binary "@$pkg" "$CHARTMUSEUM_URL/api/charts")
          cat "$out/response"; echo
          case "$status" in
            201) echo "Pushed $(basename "$pkg") to $CHARTMUSEUM_URL" ;;
            # Same as chart-releaser's skip_existing: a rerun must not fail here.
            409) echo "$(basename "$pkg") already exists on ChartMuseum, skipping" ;;
            *)   echo "::error::ChartMuseum push failed with HTTP $status"; exit 1 ;;
          esac

      - name: Package and publish to GitHub Pages
        id: github
        continue-on-error: ${{ env.CHARTMUSEUM_ENABLED == 'true' }}
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          # A rerun after a partial failure should not abort on an existing release.
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always() && steps.version.outputs.next != ''
        env:
          VERSION: ${{ steps.version.outputs.next }}
          CHARTMUSEUM: ${{ steps.chartmuseum.outcome }}
          GITHUB_PAGES: ${{ steps.github.outcome }}
          PUSH_BUMP: ${{ steps.push_bump.outcome }}
        run: |
          {
            echo "### Chart $VERSION"
            echo
            echo "| Repository | Result |"
            echo "| --- | --- |"
            if [ "$CHARTMUSEUM_ENABLED" = "true" ]; then
              echo "| ChartMuseum ($CHARTMUSEUM_URL) | ${CHARTMUSEUM:-not run} |"
            fi
            echo "| GitHub Pages | ${GITHUB_PAGES:-not run} |"
            if [ "$PUSH_BUMP" = "failure" ]; then
              echo "| Version bump push to main | failure |"
            fi
            echo
            echo '```sh'
            echo "helm repo add polaris https://polaris-security.github.io/helm"
            if [ "$CHARTMUSEUM_ENABLED" = "true" ]; then
              echo "# or, if GitHub is down:"
              echo "helm repo add polaris $CHARTMUSEUM_URL"
            fi
            echo "helm repo update"
            echo "helm install polaris polaris/polaris --version $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The GitHub steps are continue-on-error so they cannot block ChartMuseum; surface
      # their failure here so the run still goes red.
      - name: Fail if a GitHub publish step failed
        if: >-
          steps.push_bump.outcome == 'failure' ||
          steps.gh_pages.outcome == 'failure' ||
          steps.github.outcome == 'failure'
        run: |
          echo "::error::Publishing to GitHub failed (bump push: ${{ steps.push_bump.outcome }}, gh-pages: ${{ steps.gh_pages.outcome }}, release: ${{ steps.github.outcome }}). ChartMuseum: ${{ steps.chartmuseum.outcome }}."
          exit 1
