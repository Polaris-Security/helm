# Source: polaris/templates/ollama-embed-deployment.yaml
# Self-hosted Ollama for EMBEDDINGS ONLY (issue #657 semantic precedent-recall measurement).
# Ollama Cloud (ollama.com) serves no embedding models, so the measurement needs a local
# embedder. This is a standalone Deployment — deliberately NOT a backend sidecar — so the
# request-serving backend stays schedulable anywhere while the GPU embedding work can be
# pinned to a node with an NVIDIA card. Chat still runs on Ollama Cloud
# (backend.config.OLLAMA_MODEL); only the measurement job targets this service, via a
# per-run OLLAMA_BASE_URL=http://ollama-embed:11434 override.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-embed
  labels:
    app: ollama-embed
spec:
  replicas: 1
  revisionHistoryLimit: 
  selector:
    matchLabels:
      app: ollama-embed
  template:
    metadata:
      labels:
        app: ollama-embed
    spec:
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:latest
          # Start the server, wait until it answers, pull the embedding model once, then
          # hand the foreground back to the server. Re-pull is a no-op once the model is in
          # the mounted cache.
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              pid=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              # Fail the pod (CrashLoopBackOff) on a failed pull rather than serve without
              # the model — a missing model would otherwise surface only as embed-time errors.
              ollama pull "$OLLAMA_EMBED_MODEL" || { kill "$pid" 2>/dev/null; exit 1; }
              wait "$pid"
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_EMBED_MODEL
              value: "nomic-embed-text"
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              memory: "1Gi"
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-embed-models

