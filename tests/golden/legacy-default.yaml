# in the cluster. Set postgres.enabled=false to bring your own database instead — then
# postgres.urlSecret must name a Secret holding a connection URI.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-polaris
spec:
  instances: 2
  storage:
    size: 10Gi
    storageClass: local-path
  managed:
    roles:
      - login: true
        name: polaris
        superuser: true

  bootstrap:
    initdb:
      database: polaris
      owner: polaris
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-store

---
# Source: polaris/templates/cnpg-cluster.yaml
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: minio-store
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: "s3://REPLACE-ME-cnpg-backups/"
    endpointURL: "https://s3.eu-central-1.wasabisys.com"
    s3Credentials:
      accessKeyId:
        name: minio
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: minio
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 8

