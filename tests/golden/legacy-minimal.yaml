---
# Source: polaris/charts/assetDiscovery/templates/rbac.yaml
# Read-only, and only the kinds discovery looks at. No Secrets, no ConfigMaps, no pod logs
# or exec: an inventory needs to know what runs, never what it holds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: polaris-asset-discovery
  labels:
    app.kubernetes.io/name: assetDiscovery
    app.kubernetes.io/instance: polaris
    app.kubernetes.io/version: "0.99.132"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: assetDiscovery-0.1.60
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services]
    verbs: [get, list, watch]
  # Only to read kube-system's UID, the cluster's stable identity.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]

