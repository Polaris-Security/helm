# Source: polaris/templates/beat-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  annotations:
    configmap.reloader.stakater.com/reload: backend-config
spec:
  replicas: 1
  revisionHistoryLimit: 
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: docker.io/polarissecurity/backend:golden
          imagePullPolicy: Always
          command: ["celery", "-A", "config", "beat", "-l", "INFO"]
          resources:
            requests:
              memory: 256Mi
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: my-external-db
                  key: uri
            # Distinguishes beat exceptions from web/worker exceptions in PostHog
            # (ADR-0045); all three pods share the backend-config ConfigMap.
            - name: RELEASE
              value: "golden"
            - name: SERVICE_NAME
              value: polaris-beat
            - name: DEBUG
              value: "True"

---
# Source: polaris/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    configmap.reloader.stakater.com/reload: backend-config
spec:
  replicas: 1
  revisionHistoryLimit: 
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      initContainers:
        - name: migrate
          image: docker.io/polarissecurity/backend:golden
          imagePullPolicy: Always
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: my-external-db
                  key: uri
      containers:
        - name: backend
          image: docker.io/polarissecurity/backend:golden
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: my-external-db
                  key: uri
            # Tags PostHog events with the deployed release, and separates the web pod
            # from the worker/beat pods that share this ConfigMap (ADR-0045).
            - name: RELEASE
              value: "golden"
            - name: SERVICE_NAME
              value: polaris-backend
          resources:
            requests:
              memory: 512Mi

