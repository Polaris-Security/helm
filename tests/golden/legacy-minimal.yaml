# Source: polaris/charts/assetDiscovery/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: polaris-asset-discovery
  labels:
    app.kubernetes.io/name: assetDiscovery
    app.kubernetes.io/instance: polaris
    app.kubernetes.io/version: "0.99.132"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: assetDiscovery-0.1.60
# The automounted token is what the Kubernetes client reads the cluster with. The token
# presented to Polaris is a separate projected one with its own audience (deployment.yaml).
automountServiceAccountToken: true

---
# Source: polaris/templates/backend-token-review.yaml
# The backend web pod verifies Asset Discovery's projected token with a TokenReview
# (ADR-0127 in polaris-security). `system:auth-delegator` grants creating TokenReviews and
# SubjectAccessReviews and nothing else — no read of any object in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
automountServiceAccountToken: true

