# Source: polaris/charts/assetDiscovery/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris-asset-discovery
  labels:
    app.kubernetes.io/name: assetDiscovery
    app.kubernetes.io/instance: polaris
    app.kubernetes.io/version: "0.99.132"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: assetDiscovery-0.1.60
spec:
  # One per cluster: two would send the same snapshot twice, harmless but pointless.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: assetDiscovery
      app.kubernetes.io/instance: polaris
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assetDiscovery
        app.kubernetes.io/instance: polaris
    spec:
      serviceAccountName: polaris-asset-discovery
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: asset-discovery
          image: "docker.io/polarissecurity/asset-discovery:0.99.132"
          imagePullPolicy: IfNotPresent
          args: ["run"]
          env:
            - name: DISCOVERY_MODE
              value: kubernetes
            - name: POLARIS_URL
              value: "http://backend.polaris.svc.cluster.local:8000"
            - name: POLARIS_KUBERNETES_TOKEN_PATH
              value: /var/run/secrets/polaris/token
            - name: POLARIS_VERIFY_TLS
              value: "true"
            - name: REFRESH_INTERVAL
              value: "5m"
            - name: ASSET_TTL
              value: "24h"
            - name: CLUSTER_NAME
              value: "polaris"
            - name: WATCH
              value: "true"
            - name: WATCH_DEBOUNCE
              value: "15s"
            - name: PUBLIC_ADDRESSES
              value: ""
            - name: EXCLUDE_NAMESPACES
              value: ""
            - name: LOG_LEVEL
              value: "INFO"
          livenessProbe:
            exec:
              command: ["python", "-m", "polaris_discovery", "healthcheck"]
            # The first report can take a while on a large cluster.
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: polaris-token
              mountPath: /var/run/secrets/polaris
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # A token for Polaris alone: its audience means the API server would refuse it,
        # and Polaris refuses a token minted for anyone else. The kubelet rotates it.
        - name: polaris-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "polaris-asset-discovery"
                  expirationSeconds: 3600
                  path: token

